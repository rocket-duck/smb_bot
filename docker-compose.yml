services:
  telegram_bot:
    image: ghcr.io/rocket-duck/smb_bot:latest
    container_name: telegram_bot
    restart: unless-stopped
    environment:
      BOT_USERNAME: "${BOT_USERNAME}"
      API_TOKEN: "${API_TOKEN}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      NFSW_CHAT_ID: "${NFSW_CHAT_ID}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DATABASE_URL: "${DATABASE_URL:-sqlite+aiosqlite:///data/bot.db}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-development}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.0}"
      SENTRY_PROFILES_SAMPLE_RATE: "${SENTRY_PROFILES_SAMPLE_RATE:-0.0}"
      SENTRY_RELEASE: "${SENTRY_RELEASE:-}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import sqlite3; sqlite3.connect('/app/data/bot.db').execute('SELECT 1').fetchone()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
