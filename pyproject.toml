[tool.poetry]
name = "smb-bot"
version = "0.1.0"
description = ""
authors = ["void_duck"]
readme = "README.md"
packages = [
  { include = "bot" }
]

[tool.poetry.dependencies]
python = ">=3.13"
aiogram = ">=3.15.0"
openai = ">=1.57.2"
dotenv = ">=0.9.9"
sqlalchemy = ">=2.0.38"
aiosqlite = "^0.20"

[tool.poetry.group.dev.dependencies]
flake8 = ">=7.1.1"
pytest = ">=8.4.1"
pytest-asyncio = ">=0.26.0"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
bot = "bot.main:main"
