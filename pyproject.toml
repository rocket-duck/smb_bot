[tool.poetry]
name = "smb-bot"
version = "0.1.0"
description = ""
authors = ["void_duck"]
readme = "README.md"
packages = [
  { include = "bot" }
]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
openai = ">=1.57.2"
sqlalchemy = ">=2.0.38"
aiosqlite = "^0.20"
greenlet = "^3.2.4"
sentry-sdk = ">=2.0.0"
alembic = ">=1.13.0"
aiogram = ">=3.24.0"
aiohttp = ">=3.13.3,<3.14"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.1"
pytest-asyncio = ">=0.26.0"
ruff = ">=0.9.0"
black = ">=24.10.0"
pre-commit = ">=4.0.0"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
bot = "bot.main:main"
